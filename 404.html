<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Página não encontrada — Stoqio</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
  .wrap{max-width:460px}
  h1{font-size:64px;font-weight:800;color:#4f46e5;margin-bottom:4px}
  h2{font-size:20px;margin-bottom:12px}
  p{font-size:14px;color:#64748b;margin-bottom:24px;line-height:1.6}
  a{display:inline-block;background:#4f46e5;color:#fff;border-radius:8px;padding:12px 28px;font-size:14px;font-weight:700;text-decoration:none;transition:background .15s}
  a:hover{background:#4338ca}
</style>
</head>
<body>
<div class="wrap">
  <h1>404</h1>
  <h2>Página não encontrada</h2>
  <p>Desculpe, não conseguimos encontrar a página que você procura. Ela pode ter sido removida ou o endereço está incorreto.</p>
  <a href="/">Voltar ao início</a>
</div>
</body>
</html>
